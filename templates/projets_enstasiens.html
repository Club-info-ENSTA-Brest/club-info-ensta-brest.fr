{% if not htmx %}
    {% extends "base.html" %}
    {% block title %}Projets ENSTAsiens{% endblock %}
{% endif %}


{% block content %}
<div class="header">
    <p class="header-title">Cherche parmi les projets des ENSTAsiens et ENSTAsiennes de Brest</p>
    <div class="header-input">
        <input
            class="header-description-input"
            name="q"
            type="search"
            placeholder="Mots clefs"
            hx-get="{{ url_for('search_projets_enstasiens') }}"
            hx-trigger="input changed delay:150ms, search"
            hx-target="#project-results"
            hx-swap="innerHTML"
        >
    </div>
</div>
<div class="home-content-wrapper">
    <div class="home-content" id="project-results">
        {% include "_project_cards.html" %}
    </div>
</div>
{% endblock %}
